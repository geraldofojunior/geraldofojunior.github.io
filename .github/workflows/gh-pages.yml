name: Publish to GH Pages
on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # The site is static: site/ is published as is, with the talk slides next to it.
      - name: Assemble the site
        run: |
          mkdir -p public
          cp -R site/. public/
          cp -R talks public/talks

      - name: Deploy
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          branch: gh-pages
          folder: public
